[package]
name = "renx"
version = "0.3.0"
edition = "2021"
description = "A TUI tool for bulk file renaming"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
clap = { version = "4", features = ["derive"] }
glob = "0.3"
regex = "1"
unicode-normalization = "0.1.26"
chrono = "0.4.45"

[dev-dependencies]
tempfile = "3"
